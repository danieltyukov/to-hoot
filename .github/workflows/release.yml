name: Release

# On a v* tag: build the signed APK, the .deb and the .AppImage, and attach all
# three to a GitHub Release on this public repository.
#
# The release has to be on the public repository. Assets on a private repository
# are not anonymously downloadable, and the browser on a phone has no GitHub
# session, so a private release asset is a link that cannot be followed from the
# device that needs it.
#
# Standard GitHub-hosted runners throughout: Actions minutes are free and
# unmetered on a public repository with standard runners, and a larger runner
# bills even on a public one.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The asset names the site and the README link to. They carry no version, so
  # `releases/latest/download/<name>` keeps working across releases; the version
  # is the release title and the tag.
  APK_NAME: to-hoot.apk
  DEB_NAME: to-hoot_amd64.deb
  APPIMAGE_NAME: to-hoot_x86_64.AppImage

jobs:
  desktop:
    name: deb and AppImage
    # 22.04, deliberately, and not ubuntu-latest. glibc pins forward: a binary
    # built on 24.04 fails to start on 22.04 with a missing-symbol error, while
    # one built here runs on both. 22.04 is the oldest image that still ships
    # WebKitGTK 4.1, which is what makes it the right base.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # librsvg2-dev is only needed for the AppImage, and its absence is not
      # obvious: linuxdeploy's GTK plugin exits 1 with "there is no 'libdir'
      # variable for 'librsvg-2.0'" while the deb still builds, so the failure
      # looks unrelated to the bundle target.
      - name: Install the WebKitGTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache the Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: cargo-ubuntu-22.04-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-ubuntu-22.04-

      # The root install is not optional even though apps/desktop is outside the
      # workspace: `tauri build` runs stage-web.mjs, which builds packages/ui
      # from the repository root.
      - run: npm ci

      - run: npm ci
        working-directory: apps/desktop

      # The cache above restores src-tauri/target, and the bundle directory is
      # inside it. Tauri puts the version in each filename, so without this the
      # second release finds the first release's .deb sitting beside the new one
      # and the collector below, which demands exactly one match, fails the job.
      # It would pass the first tag and fail every tag after it.
      - name: Build the bundles
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle
          npm run build

      - name: Collect them under stable names
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir -p out

          take() {
            local dest="$1"
            shift
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "expected exactly one bundle for $dest, found $#" >&2
              find "$bundle" -maxdepth 2 -type f >&2 || true
              exit 1
            fi
            cp "$1" "out/$dest"
            echo "$1 -> $dest"
          }

          take "$DEB_NAME" "$bundle"/deb/*.deb
          take "$APPIMAGE_NAME" "$bundle"/appimage/*.AppImage
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: desktop
          path: out/
          retention-days: 1
          if-no-files-found: error

  android:
    name: Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android platform this project compiles against
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` is killed by SIGPIPE once sdkmanager stops reading, which
          # pipefail would otherwise report as a failed step.
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # As above: `npm run sync` builds packages/ui from the repository root.
      - run: npm ci

      - run: npm ci
        working-directory: apps/mobile

      # Base64 in, temp file out, and removed in an always() step below. The
      # keystore is never in the repository, and *.jks, *.keystore and
      # keystore.properties are gitignored so it cannot arrive by accident.
      #
      # Not gated on an `if:`, because the secrets context is not available in a
      # step condition. An absent secret is handled here instead, and said out
      # loud rather than producing an unsigned APK quietly.
      - name: Write the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # assembleRelease, which produces an APK. Gradle's bundleRelease, and
      # `cap build android` without --androidreleasetype APK, produce an AAB
      # instead: the Play Store accepts one and a phone cannot sideload it.
      #
      # With no keystore at KEYSTORE_PATH, app/build.gradle leaves the APK
      # unsigned rather than failing, so a fork holding no secrets still gets a
      # release out.
      - name: Build the release APK
        working-directory: apps/mobile
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run apk:release

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect the APK and say whether it is signed
        run: |
          set -euo pipefail
          outputs=apps/mobile/android/app/build/outputs/apk/release
          mkdir -p out

          if [ -f "$outputs/app-release.apk" ]; then
            cp "$outputs/app-release.apk" "out/$APK_NAME"
          elif [ -f "$outputs/app-release-unsigned.apk" ]; then
            echo "::warning::Unsigned APK. It cannot install over a signed build, and a signed build cannot install over it."
            cp "$outputs/app-release-unsigned.apk" "out/$APK_NAME"
          else
            echo "no APK in $outputs" >&2
            ls -la "$outputs" >&2 || true
            exit 1
          fi

          # The newest build-tools on the image, rather than a pinned version:
          # this reports what went out and never decides whether the job passes.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs "out/$APK_NAME" \
              || echo "::warning::apksigner could not verify this APK. Treat it as unsigned."
          else
            echo "::warning::apksigner is not on this image, so the signature was not checked."
          fi
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - run: ls -la assets

      # gh rather than a third-party release action: it is preinstalled, it uses
      # this job's own token, and it is one less repository whose compromise
      # would reach a binary somebody installs.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "$notes" <<'BODY'
          Built by `.github/workflows/release.yml` on GitHub-hosted runners, from
          the commit this tag points at. The build log is public.

          - `to-hoot.apk`, Android. Your browser asks once for permission to
            install it.
          - `to-hoot_x86_64.AppImage`, Linux. `chmod +x` and run it.
          - `to-hoot_amd64.deb`, Debian and Ubuntu:
            `sudo apt install ./to-hoot_amd64.deb`

          The desktop builds are made on Ubuntu 22.04, so they run on older
          systems as well as newer ones.
          BODY

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$notes" \
            --generate-notes \
            --verify-tag \
            "assets/$APK_NAME" \
            "assets/$DEB_NAME" \
            "assets/$APPIMAGE_NAME"
