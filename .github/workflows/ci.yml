name: CI

# Standard GitHub-hosted runners throughout. Actions minutes are free and
# unmetered on a public repository with standard runners; a larger runner bills
# even on a public repository, so `runs-on` never names one.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A second push to the same branch cancels the first. The last commit is the one
# whose result anybody acts on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No build step first: vitest aliases @to-hoot/core to its source, which is
      # what lets a fresh clone run green. TypeScript still resolves it through
      # the export map, so `npm run typecheck` above is what keeps the published
      # entry points honest.
      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/ui

      # The E2E config starts `vite preview` against a real build rather than
      # the dev server, so this covers the bundle that ships.
      - name: Playwright
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/ui/playwright-report/
            packages/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The site is outside the workspace, with its own lockfile. It is built
      # here as well as in pages.yml because it imports the application's
      # tokens.css from outside its own root: moving or renaming that file
      # breaks the site, and a pull request should say so rather than the next
      # deploy discovering it.
      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site
