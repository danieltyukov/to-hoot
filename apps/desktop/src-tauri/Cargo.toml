[package]
name = "to-hoot-desktop"
version = "0.9.0"
description = "to-hoot desktop shell"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "to_hoot_desktop_lib"
# Only main.rs links the library. Tauri's template also asks for a cdylib and a
# staticlib, which its own Android and iOS builds need; the phone app here is
# Capacitor, so those were two extra copies of every dependency per build, 2.2 GB
# of a 5.9 GB target/debug.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is a Cargo feature, not a plugin. The tray is driven by its menu:
# Linux emits no click event for a tray icon, so anything hung off a click
# handler would work on two platforms out of three.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
# For editing each agent's own config file in place: read what is there, add
# one server, write it back. Tauri already pulls serde in; toml_edit is for
# Codex's config.toml, and keeps the person's comments and ordering intact.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"

# Pure Rust X11 client, so the OS idle query needs no C headers at build time.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver"] }

# GetLastInputInfo and GetTickCount, the counter Windows drives its own
# screensaver from. Raw bindings only; nothing else from the SDK is needed.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }

# Debug and test builds keep file and line numbers for panics and backtraces,
# but not the variable and type info a debugger reads. Dropping that full info
# for Tauri, GTK and WebKit's bindings takes a debug build plus the tests from
# 3.7 GB to 2.4 GB.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
