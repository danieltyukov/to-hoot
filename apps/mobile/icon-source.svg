<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>ToHoot</title>
  <!--
    The launcher artwork, generated by scripts/render-icons.mjs. Edit that
    script, not this file.

    Full bleed, because Android masks it: the clay ground is the adaptive icon's
    background layer and the face is its foreground, so whatever shape the
    launcher cuts, the whole tile is clay with the face inside the safe zone.
  -->
  <rect width="1024" height="1024" fill="#c2603f"/>
  <g transform="translate(96 15) scale(26)">
    <path fill="#12110f" d="M7.6,15.6 a3.5,3.5 0 1,0 7,0 a3.5,3.5 0 1,0 -7,0 Z M17.4,15.6 a3.5,3.5 0 1,0 7,0 a3.5,3.5 0 1,0 -7,0 Z M13.7,20 L18.3,20 L16,24.6 Z"/>
  </g>
</svg>
