apply plugin: 'com.android.application'

/*
 * Release signing material, in the order it is looked for:
 *
 *   1. Environment variables. This is what CI uses: the keystore is written to
 *      a path from a secret and never touches the repository.
 *   2. keystore.properties next to this project, gitignored, for signing a
 *      build by hand without exporting four variables first.
 *
 * With neither present the release build stays unsigned rather than failing, so
 * a checkout can be built by anyone; `assembleDebug` is unaffected either way.
 *
 * Creating a keystore, once, and keeping it somewhere safe:
 *
 *   keytool -genkeypair -v -keystore to-hoot-release.jks -alias to-hoot \
 *           -keyalg RSA -keysize 4096 -validity 10000
 *
 * Losing it means the app can never be updated in place again, on any device
 * that installed a build signed with it.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String env, String property ->
    System.getenv(env) ?: keystoreProperties.getProperty(property)
}

def keystorePath = signingValue('KEYSTORE_PATH', 'storeFile')
def hasSigningMaterial = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace = "com.tohoot.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tohoot.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningMaterial) {
                storeFile file(keystorePath)
                storePassword signingValue('KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasSigningMaterial) {
                signingConfig signingConfigs.release
            } else {
                // Left unsigned deliberately, and said out loud: an APK that is
                // silently signed with the debug key installs happily and then
                // cannot be upgraded by a real release.
                logger.lifecycle('to-hoot: no signing material found, release build will be unsigned')
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
