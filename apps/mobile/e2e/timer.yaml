# Start a task's timer and watch the clock move.
#
# Selectors are the strings a person sees, or the aria-labels the WebView
# publishes to the accessibility tree ("Start timer for <task>"), which is why
# every icon-only control in the ui has one.
appId: com.tohoot.app
---
- launchApp:
    clearState: true
- tapOn: "Add a task"
- inputText: "Write the report"
- pressKey: Enter
- assertVisible: "Write the report"
- tapOn: "Start timer for Write the report"
# A running timer reads m:ss, so it passes through 0:0x on its way up. The
# assertion is that it is counting at all: a display frozen at 0:00 and a
# display that stopped look identical in a screenshot.
- assertVisible: "0:0"
- assertVisible: "Stop timer for Write the report"
- takeScreenshot: timer-running
- tapOn: "Stop timer for Write the report"
- assertVisible: "Start timer for Write the report"
