<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>to-hoot</title>
  <!--
    The negative-space mark. The eyes and beak are holes, not painted shapes, so
    the icon sits correctly on both a light and a dark browser chrome without
    two files. The clay accent carries enough contrast against either.

    Keep this path identical to OwlIcon.tsx; a test asserts they have not drifted.
  -->
  <style>
    path { fill: #c2603f }
    @media (prefers-color-scheme: dark) { path { fill: #d97757 } }
  </style>
